version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kromacommerce-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kromacommerce
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kromacommerce-gateway
    restart: always
    ports:
      - '8000:8000'
    environment:
      NODE_ENV: production
      PORT: 8000
      CONSOLIDATED_MODE: 'true'
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/kromacommerce?sslmode=disable
      JWT_ACCESS_SECRET: strong-jwt-access-secret-32-chars-min
      JWT_REFRESH_SECRET: strong-jwt-refresh-secret-32-chars-min
      PAYMENT_PROVIDER: mock
    depends_on:
      - postgres

  web-client:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.web
    container_name: kromacommerce-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_URL: http://api-gateway:8000
      GATEWAY_URL: http://api-gateway:8000
    depends_on:
      - api-gateway

volumes:
  postgres_data:
